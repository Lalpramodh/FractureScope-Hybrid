<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FractureScope</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #bad1f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .forgot-container {
      background-color: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 450px;
    }
    .forgot-title {
      text-align: center;
      margin-bottom: 25px;
      font-weight: bold;
    }
    .btn-warning {
      border-radius: 8px;
    }
    .back-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="forgot-container">
  <h4 class="forgot-title">Reset Your Password</h4>
    <form action="{{ url_for('forgot_password') }}" method="post">
    <div class="mb-3">
      <label for="email" class="form-label">Enter your registered email address</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="example@domain.com" required>
    </div>
    <div class="d-grid">
      <button type="submit" class="btn btn-warning">Send Reset Link</button>
    </div>
  </form>
  <div class="back-link">
     <p class="mt-3">Remember your password? <a href="{{ url_for('login') }}">Back to Login</a></p>
  </div>
</div>

</body>
</html>
